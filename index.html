<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merushka Francis | Clinical Psychologist</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       CLIENT PALETTE & TYPOGRAPHY
       ========================================================= */
    :root {
      --color-heading: #ff5800;
      --color-anchor: #d06c37;
      --color-sand: rgba(245, 209, 185, 0.85);
      --color-footer-bg: #B33A3A;
      --color-subheading: #e9e6e6;
      --color-body: #4f5354;
      --color-dark: #2d2d2d;
      --font-main: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      height: 100%;
      min-height: 100vh;
      font-family: var(--font-main);
      font-weight: 300;
      color: var(--color-body);
      line-height: 1.75;
      overflow-y: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--color-sand);
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: opacity 0.2s, color 0.2s;
    }

    a:hover {
      opacity: 0.85;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 40px;
      position: relative;
      z-index: 2;
    }

    /* =========================================================
       TOP NAVIGATION
       ========================================================= */
    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: transparent;
      padding: 20px 0;
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .nav-brand {
      font-weight: 700;
      color: #ffffff;
      font-size: 1.25rem;
      letter-spacing: -0.3px;
      line-height: 1.2;
      display: flex;
      flex-direction: row; /* Desktop: side by side */
      align-items: baseline;
      gap: 10px; /* Space between name and subtitle */
      text-shadow: none;
    }

    .nav-brand span {
      font-weight: 300;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: normal;
    }

    /* ——— hamburger ——— */
    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 36px;
      height: 36px;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
      z-index: 1001;
      position: relative;
    }

    .hamburger span {
      display: block;
      width: 28px;
      height: 3px;
      background: #ffffff;
      border-radius: 3px;
      transition: all 0.3s ease;
      position: absolute;
    }

    .hamburger span:nth-child(1) { transform: translateY(-8px); }
    .hamburger span:nth-child(2) { transform: translateY(0); }
    .hamburger span:nth-child(3) { transform: translateY(8px); }

    .hamburger.active span:nth-child(1) { transform: rotate(45deg); }
    .hamburger.active span:nth-child(2) { opacity: 0; transform: scale(0); }
    .hamburger.active span:nth-child(3) { transform: rotate(-45deg); }

    /* ——— nav-links drawer ——— */
    .nav-links {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: var(--color-footer-bg);
      backdrop-filter: blur(16px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 40px 40px;
      gap: 30px;
      list-style: none;
      transition: right 0.4s ease;
      display: flex;
      opacity: 0.95;
    }

    .nav-links.open {
      right: 0;
    }

    .nav-links a {
      font-size: 1.2rem;
      color: #ffffff;
      font-weight: 400;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.3s ease;
    }

    .nav-links a.active,
    .nav-links a:hover {
      color: #ffffff;
      font-weight: 600;
    }

    /* =========================================================
       HERO HEADER (Full Screen Cover)
       ========================================================= */
    .hero {
      position: relative;
      background-image:
        linear-gradient(rgba(106, 50, 22, 0.25), rgba(173, 79, 32, 0.25)),
        linear-gradient(rgba(200, 120, 60, 0.15), rgba(200, 120, 60, 0.15)),
        url('images/HeroImage.jpeg');
      background-size: 110%;
      background-position: center;
      background-repeat: no-repeat;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
    }

    .hero-content {
      max-width: 650px;
      text-align: left;
      margin-left: 180px;
      transform: translateY(-110px);
    }

    /* ===== QUOTE ===== */
    .quote-text {
      color: #ffffff;
      font-weight: 300;
      font-size: 2.2rem;
      line-height: 1.6;
      font-style: italic;
      max-width: 750px;
      letter-spacing: 0.5px;
      margin: 0 0 16px 0;
    }

    .quote-author {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 300;
      font-size: 1rem;
      margin-bottom: 0;
      letter-spacing: 1px;
      font-style: normal;
    }

    .quote-author span {
      font-style: normal;
    }

    /* =========================================================
       RESPONSIVE DESIGN (MOBILE PORTRAIT)
       ========================================================= */
    @media (max-width: 768px) {
      /* Mobile: stack the brand name and subtitle vertically */
      .nav-brand {
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        line-height: 1.3;
      }

      .nav-brand span {
        font-size: 0.8rem;
        margin-top: -2px;
      }

      .hero {
        background-image:
          linear-gradient(rgba(106, 50, 22, 0.25), rgba(173, 79, 32, 0.25)),
          linear-gradient(rgba(200, 120, 60, 0.15), rgba(200, 120, 60, 0.15)),
          url('images/homePortrait.jpg');
        background-size: 110%;
        justify-content: center;
      }

      .hero-content {
        margin-left: 0;
        padding: 0 24px;
        text-align: center;
        transform: translateY(-60px);
      }

      .quote-text {
        font-size: 1.25rem;
      }
    }

    @media (max-width: 480px) {
      .quote-text { font-size: 1.1rem; }
    }
  </style>
</head>

<body>

  <!-- ===== NAVIGATION ===== -->
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        Merushka Francis <span>| Clinical Psychologist</span>
      </a>
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="about.html">About</a></li>
        <li><a href="approach.html">Approach</a></li>
        <li><a href="areas.html">Areas of Interest</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== HERO ===== -->
  <header class="hero">
    <div class="hero-content">
      <!-- Quote -->
      <div class="quote-text">
        &ldquo;Not everything that is faced <br> can be changed, <br> but nothing can be changed <br> until it is faced.&rdquo;
      </div>
      <p class="quote-author"><span>James Baldwin</span></p>
    </div>
  </header>

  <script>
    // ===== HAMBURGER TOGGLE =====
    (function() {
      const hamburger = document.getElementById('hamburgerBtn');
      const navLinks = document.getElementById('navLinks');

      hamburger.addEventListener('click', function(e) {
        e.stopPropagation();
        this.classList.toggle('active');
        navLinks.classList.toggle('open');
      });

      document.addEventListener('click', function(e) {
        const nav = document.querySelector('.top-nav');
        if (nav && !nav.contains(e.target)) {
          hamburger.classList.remove('active');
          navLinks.classList.remove('open');
        }
      });

      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function() {
          hamburger.classList.remove('active');
          navLinks.classList.remove('open');
        });
      });
    })();
  </script>

</body>

</html>
